<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oraculum — Time Lab</title>
<link rel="stylesheet" href="src/styles/oraculum-time-lab.css">
</head>
<body>
<header class="topbar">
  <div><strong>ORACULUM</strong><span class="sub">TIME LAB</span></div>
  <div class="asset">BTCUSD <span>▾</span></div>
</header>

<main>
  <section class="controls">
    <div class="control-group">
      <label>ÂNCORA</label>
      <button id="anchor">HALVING</button>
    </div>
    <div class="control-group">
      <label>EIXO</label>
      <div class="seg"><button class="active" data-mode="calendar">CALENDÁRIO</button><button data-mode="relative">RELATIVO</button></div>
    </div>
    <div class="control-group">
      <label>NORMALIZAÇÃO</label>
      <button id="norm">100</button>
    </div>
  </section>

  <section class="timeline-card">
    <div class="card-head">
      <div><strong id="modeTitle">Calendário</strong><span id="range">2016 — 2026</span></div>
      <span class="badge">3 SÉRIES</span>
    </div>
    <div class="chart-wrap">
      <div class="axis-labels" id="axis"></div>
      <svg id="chart" viewBox="0 0 1000 440" preserveAspectRatio="none" aria-label="BTC cycles"></svg>
      <div class="anchor-line"><span>ÂNCORA</span></div>
    </div>
    <div class="legend">
      <span><i></i> BTC 2016</span><span><i></i> BTC 2020</span><span><i></i> BTC 2024</span>
    </div>
  </section>

  <section class="offset-card">
    <div class="offset-head"><strong>DESLOCAMENTO</strong><span id="offsetValue">0 dias</span></div>
    <input id="offset" type="range" min="-90" max="90" value="0" step="1">
    <div class="ticks"><span>-90</span><span>-45</span><span>ÂNCORA</span><span>+45</span><span>+90</span></div>
  </section>

  <section class="info">
    <div><span>Âncora</span><strong>Halving</strong></div>
    <div><span>Modo</span><strong id="infoMode">Calendário</strong></div>
    <div><span>Base</span><strong>100</strong></div>
  </section>
</main>
<script src="src/styles/oraculum-time-lab.js"></script>
</body>
</html>
