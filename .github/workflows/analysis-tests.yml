name: Analysis core tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/analysis/**/*.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/analysis-tests.yml'
  pull_request:
    paths:
      - 'src/analysis/**/*.js'
      - 'src/ui/**'
      - 'src/events/**'
      - 'src/app.js'
      - 'src/styles.css'
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/analysis-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:analysis
