<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Hub Test</title>
</head>
<body>
  <h1>Hub Test (v9)</h1>
  <script type="module">
    import { Hub } from './index.js';

    Hub.on('series:loaded', ({ tf, data }) => {
      console.log(`⚡ Série ${tf} carregada com ${data.length} pontos`);
    });

    (async () => {
      await Hub.init('1d');
      const snap = Hub.getSnapshot('1d');
      console.log("📊 Snapshot:", snap);
    })();
  </script>
</body>
</html>
