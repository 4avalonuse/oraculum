<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORACULUM</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<main id="app">
<header class="topbar">
  <div class="brand">ORACULUM</div>
  <select id="asset-select" aria-label="Ativo principal"><option value="BTC-USD">BTC</option></select>
  <div id="status" class="status">CARREGANDO</div>
</header>
<section class="oraculum">
  <section class="chart-card">
    <div class="chart-head">
      <div><strong>BTC / USD</strong><small id="source">Data API</small></div>
      <a class="expand" href="https://4avalonuse.github.io/Ochama/" target="_blank" rel="noopener">AMPLIAR ↗</a>
    </div>
    <div class="chart-stack">
      <div id="chart" class="chart-wrap">
        <div class="chart-controls">
        <div class="interval-control"><button id="interval-toggle">D</button><div id="interval-menu" class="interval-menu">
          <button data-interval="1h">H</button><button data-interval="1d" class="active">D</button><button data-interval="1w">W</button><button data-interval="1M">M</button>
        </div></div>
        <button id="refresh-toggle" title="Atualizar dados">↻</button>
        <button id="fit-toggle">FIT</button><button id="chart-type-toggle">CANDLE</button><button id="scale-toggle">NORMAL</button>
        </div>
      </div>
      <div id="timeline" class="timeline" aria-label="Timeline de eventos"></div>
      <div id="timeline-lines" class="timeline-lines" aria-hidden="true"></div>
      <div id="event-menu" class="event-menu" aria-label="Menu de eventos"></div>
    </div>
    <div class="chart-foot"><span id="range-label">—</span><span id="count">—</span></div>
  </section>

    <section class="analysis-card" id="asset-analysis">
      <div class="analysis-head">
        <div><strong>ANÁLISE DE ATIVOS</strong><small>BTC como ativo principal</small></div>
        <span id="analysis-status">AGUARDANDO</span>
      </div>
      <div class="asset-picks">
        <label class="asset-pick primary"><input type="checkbox" checked disabled><span>BTC</span><small>PRINCIPAL</small></label>
        <label class="asset-pick"><input id="sol-select" type="checkbox"><span>SOL</span><small>COMPARAR</small></label>
      </div>
      <div id="comparison-panel" class="comparison-panel is-hidden">
        <div class="comparison-head">
          <div><strong>BTC × SOL</strong><small>Base 100 · retornos relativos · escala logarítmica</small></div>
          <span id="comparison-period">—</span>
        </div>
        <div id="comparison-chart" class="comparison-chart" aria-label="Comparação normalizada BTC e SOL"></div>
        <div class="comparison-legend"><span><i class="legend-btc"></i>BTC</span><span><i class="legend-sol"></i>SOL</span><span class="comparison-note">Preços nominais permanecem disponíveis na análise completa.</span></div>
      </div>
      <div id="analysis-results" class="analysis-results is-hidden"></div>
      <button id="full-analysis" class="full-analysis is-hidden">ANÁLISE COMPLETA ↗</button>
    </section>
  </section>
</main>
<script type="module" src="./src/app.js"></script>
</body>
</html>
