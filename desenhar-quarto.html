<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planta do quarto</title><style>body{font-family:system-ui;background:#f4f6fa;margin:12px;color:#172033}.app{max-width:800px;margin:auto}button{padding:11px;margin:3px;border:1px solid #aab;border-radius:9px;background:white}button.sel{background:#bfe2ff}canvas{width:100%;background:white;border:2px solid #334;touch-action:none;display:block}p{line-height:1.4}</style></head><body><div class="app"><h2>Desenhar meu quarto</h2><p>Desenhe com o dedo, olhando de cima. Marque cama, porta, janela, banheiro e o espaço das máquinas.</p><div id="tools"><button class="sel" data-c="#222">Parede</button><button data-c="#2865cf">Cama</button><button data-c="#159447">Porta</button><button data-c="#00a5b9">Janela</button><button data-c="#e67e22">Máquinas</button><button data-c="#8e44ad">Banheiro</button><button data-c="#ffffff">Borracha</button></div><canvas id="pad" width="750" height="650"></canvas><button id="undo">↶ Desfazer</button><button id="clear">Limpar</button><button id="save">Salvar imagem PNG</button><p>Referência: quarto de aproximadamente 4 × 6 metros. Depois envie o PNG aqui no chat.</p></div><script>const c=document.getElementById('pad'),g=c.getContext('2d');let ink='#222',down=false,history=[];g.fillStyle='white';g.fillRect(0,0,c.width,c.height);g.lineCap='round';g.lineJoin='round';function point(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.addEventListener('pointerdown',e=>{e.preventDefault();history.push(g.getImageData(0,0,c.width,c.height));if(history.length>25)history.shift();down=true;c.setPointerCapture(e.pointerId);const [x,y]=point(e);g.beginPath();g.moveTo(x,y);g.lineTo(x+.1,y+.1);g.strokeStyle=ink;g.lineWidth=ink==='#ffffff'?25:5;g.stroke()});c.addEventListener('pointermove',e=>{if(!down)return;e.preventDefault();const [x,y]=point(e);g.lineTo(x,y);g.stroke()});c.addEventListener('pointerup',()=>down=false);c.addEventListener('pointercancel',()=>down=false);document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ink=b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});document.getElementById('undo').onclick=()=>{if(history.length)g.putImageData(history.pop(),0,0)};document.getElementById('clear').onclick=()=>{history.push(g.getImageData(0,0,c.width,c.height));g.fillStyle='white';g.fillRect(0,0,c.width,c.height)};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='planta-quarto.png';a.href=c.toDataURL('image/png');a.click()};</script></body></html>
