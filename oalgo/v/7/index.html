<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>OAlgo — Fase 7 (Backtest Animado)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/10.4.1/jsoneditor.min.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background:#0b1220; color:#e6edf3; }
    header { padding: 12px 16px; border-bottom:1px solid #1f2a44; display:flex; align-items:center; gap:12px; }
    .wrap { display:grid; grid-template-columns: 420px 1fr; height: calc(100vh - 58px); }
    #left { border-right:1px solid #1f2a44; padding:12px; overflow:auto; }
    #left h3 { margin: 8px 0; }
    #controls { display:flex; gap:8px; flex-wrap:wrap; margin: 8px 0 12px; }
    button, select, input { background:#0f172a; color:#e6edf3; border:1px solid #2a3a5e; border-radius:8px; padding:8px 10px; }
    button:hover { background:#101a34; }
    #jsoneditor { height: 240px; border:1px solid #2a3a5e; border-radius:8px; }
    #chartBox { padding:14px; }
    canvas { background:#0b1220; }
    .muted { color:#8ca0c8; }
  </style>
</head>
<body>
  <header>
    <strong>OAlgo</strong> — Fase 7: Backtest animado (demo)
    <div class="muted">Lego & JSON sincronizados • Cursor animado • Sinais BUY/SELL</div>
  </header>

  <div class="wrap">
    <div id="left">
      <h3>Lego (regras)</h3>
      <div id="lego"></div>

      <h3 style="margin-top:14px;">JSON do algoritmo</h3>
      <div id="jsoneditor"></div>

      <h3 style="margin-top:14px;">Backtest</h3>
      <div id="controls">
        <button id="btnStart">▶️ Start</button>
        <button id="btnPause">⏸️ Pause</button>
        <button id="btnReset">⏮️ Reset</button>
        <label>Velocidade(ms): <input id="speed" type="number" value="150" min="30" step="10" style="width:88px;"></label>
      </div>
      <div class="muted">Dica: edite as regras no Lego ou no JSON; o Lego tem prioridade em conflitos.</div>
    </div>

    <div id="chartBox">
      <canvas id="btChart" height="520"></canvas>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/10.4.1/jsoneditor.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="core/Storage.js"></script>
  <script src="core/BridgeOChart.js"></script>
  <script src="core/OAlgoEngine.js"></script>
  <script src="core/Backtest.js"></script>
  <script src="ui/lego.js"></script>
  <script src="index.js"></script>
</body>
</html>
