<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#070b14"/>
  <title>OChart — Oraculum · v2026.09.17.02</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%222%22 y=%2213%22 font-size=%2212%22>◈</text></svg>">
  <script src="./libs/chart.umd.js?v=2026.09.17.02"></script>
  <script src="./libs/chartjs-adapter-date-fns.bundle.js?v=2026.09.17.02"></script>
  <script src="./libs/chartjs-chart-financial.min.js?v=2026.09.17.02"></script>
  <script src="./libs/chartjs-plugin-zoom.min.js?v=2026.09.17.02"></script>
  <script src="./libs/chartjs-plugin-annotation.min.js?v=2026.09.17.02"></script>
  <link rel="stylesheet" href="./src/style/app.css?v=2026.09.17.02">
  <link rel="stylesheet" href="./src/style/v2.css?v=2026.09.17.02">
</head>
<body class="ui-surface">
  <header class="ochart-topbar">
    <div class="brand">
      <div class="brand-mark">◈</div>
      <div><strong>OChart <small>v2026.09.17<span class="version-suffix">.02</span></small></strong><span>Oraculum market viewer</span></div>
    </div>
    <div class="dataset-picker">
      <label for="sel-dataset">Mercado</label>
      <select id="sel-dataset"><option value="">Carregando…</option></select>
    </div>
    <div class="top-actions">
      <button id="btn-sync" class="primary">↻ Atualizar</button>
      <button id="btn-theme" title="Alternar tema">☼</button>
    </div>
  </header>

  <main class="ochart-main">
    <section class="market-strip">
      <div class="market-title">
        <span class="eyebrow">SÉRIE</span>
        <h1 id="dataset-name">Carregando dados</h1>
        <span id="dataset-meta" class="subtle">—</span>
      </div>
      <div class="quote-stat"><span>Último</span><strong id="k-close">—</strong></div>
      <div class="quote-stat"><span>Máxima</span><strong id="k-max">—</strong></div>
      <div class="quote-stat"><span>Mínima</span><strong id="k-min">—</strong></div>
      <div class="quote-stat"><span>Barras</span><strong id="k-bars">—</strong></div>
    </section>

    <section class="chart-card">
      <div class="chart-toolbar">
        <div class="toolbar-group">
          <span class="toolbar-label">Visualização</span>
          <div class="seg">
            <button id="btn-type-line" class="active">Linha</button>
            <button id="btn-type-candle">Candles</button>
          </div>
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">Escala</span>
          <div class="seg">
            <button id="btn-scale-linear" class="active">Linear</button>
            <button id="btn-scale-log">Log</button>
          </div>
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">Dados</span>
          <span class="subtle">Série normalizada pela Data API</span>
        </div>
        <div class="toolbar-spacer"></div>
        <button id="btn-table" class="ghost">▦ Tabela</button>
        <span id="status" class="status-pill">Conectando…</span>
      </div>

      <div class="chart-shell">
        <canvas id="ch"></canvas>
      </div>
      <div id="analysis-periods" class="analysis-periods"></div>
    </section>

    <section class="insight-grid">
      <div class="insight-card"><span>Fonte</span><strong id="k-provider">—</strong></div>
      <div class="insight-card"><span>Intervalo</span><strong id="k-interval">—</strong></div>
      <div class="insight-card"><span>Moeda</span><strong id="k-currency">—</strong></div>
      <div class="insight-card"><span>Atualizado</span><strong id="k-updated">—</strong></div>
    </section>
  </main>

  <div id="dev-hud-root"></div>
  <script type="module" src="./src/app.js?v=2026.09.17.02"></script>
</body>
</html>
